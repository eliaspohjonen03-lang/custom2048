<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="2048">
<meta name="description" content="2048-peli omilla kuvilla – toimii myös ilman nettiä.">
<title>2048</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./css/style.css">
<script type="module" src="./js/main.js"></script>
</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <h1>2048</h1>
      <div class="scorebox"><div class="lbl">Pisteet</div><div class="val" id="score">0</div></div>
      <div class="scorebox"><div class="lbl">Paras</div><div class="val" id="best">0</div></div>
    </div>
    <div class="chips">
      <div class="chip"><span class="lbl">Aika</span><b id="time">0:00</b></div>
      <div class="chip"><span class="lbl">Siirrot</span><b id="moves">0</b></div>
      <div class="chip"><span class="lbl">Peruutukset</span><b id="undos">0</b></div>
    </div>
    <div class="toolbar">
      <div class="seg" id="sizes" role="group" aria-label="Ruudukon koko"></div>
      <div class="spacer"></div>
      <button class="icon-btn" id="btnStats" aria-label="Tilastot" title="Tilastot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      </button>
      <button class="icon-btn" id="btnSettings" aria-label="Asetukset ja kuvat" title="Asetukset ja kuvat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="board-wrap">
    <div class="board" id="board">
      <div class="grid" id="grid"></div>
      <div class="tiles" id="tiles"></div>
    </div>
  </div>

  <div class="actions">
    <button class="btn" id="btnUndo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      Peruuta siirto
    </button>
    <button class="btn primary" id="btnNew">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg>
      Uusi peli
    </button>
  </div>

  <div class="card">
    <h3>Eteneminen <span id="evoName">Tavalliset numerot</span></h3>
    <div class="evo" id="evo"></div>
  </div>
  <p class="hint">Pelaa nuolinäppäimillä tai pyyhkäisemällä laudalla. Peruutus: Ctrl+Z.</p>
</div>
<div class="toast" id="toast"></div>
<input type="file" accept="image/*" class="hidden-input" id="fileOne">
<input type="file" accept="image/*" multiple class="hidden-input" id="fileMany">
<input type="file" accept=".json,application/json,text/plain" class="hidden-input" id="fileImport">

</body>
</html>
