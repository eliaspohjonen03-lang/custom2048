<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#f4f6f9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="2048">
<title>2048</title>
<style>
:root{
  --bg:#f4f6f9; --panel:#ffffff; --ink:#1e2833; --muted:#6a7684; --line:#e1e6ec;
  --board:#d8dfe7; --cell:#e8edf2; --accent:#2f6fec; --danger:#d9434f;
  --anim:100ms;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
.app{max-width:540px;margin:0 auto;padding:12px 12px calc(20px + env(safe-area-inset-bottom))}

/* Header */
.top{display:flex;align-items:center;gap:8px}
h1{margin:0;flex:1;font-size:36px;font-weight:800;letter-spacing:-1.5px;line-height:1}
.scorebox{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;min-width:78px;text-align:center}
.lbl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.scorebox .val{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.chips{display:flex;gap:6px;margin-top:8px}
.chip{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 9px;display:flex;justify-content:space-between;align-items:center;gap:6px;min-width:0}
.chip b{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.toolbar{display:flex;align-items:center;gap:6px;margin:10px 0}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:6px 10px;border-radius:4px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}
.spacer{flex:1}
.icon-btn{width:38px;height:36px;border:1px solid var(--line);background:var(--panel);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;padding:0}
.icon-btn svg{width:19px;height:19px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:10px 14px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.danger{color:var(--danger)}
.btn.small{padding:6px 10px;font-size:13px}
.btn:disabled,.icon-btn:disabled{opacity:.4;cursor:default}
.actions{display:flex;gap:8px;margin-top:10px}
.actions .btn{flex:1}

/* Board */
.board-wrap{width:min(100%,calc(100vh - 290px));min-width:min(100%,300px);margin:0 auto}
.board{position:relative;width:100%;aspect-ratio:1/1;background:var(--board);border-radius:8px;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden;--gap:8px;--tpx:60px;--tr:4px}
@supports not (aspect-ratio:1/1){.board{height:0;padding-bottom:100%}}
.grid,.tiles{position:absolute;inset:var(--gap)}
.grid{display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);gap:var(--gap)}
.grid div{background:var(--cell);border-radius:var(--tr)}
.tile{position:absolute;left:0;top:0;
  width:calc((100% - (var(--n) - 1) * var(--gap)) / var(--n));
  height:calc((100% - (var(--n) - 1) * var(--gap)) / var(--n));
  transform:translate(calc(var(--c) * (100% + var(--gap))), calc(var(--r) * (100% + var(--gap))));
  transition:transform var(--anim) ease-in-out;will-change:transform}
.tile.hidden{visibility:hidden}
.tile.spawn .face{animation:fadein 120ms ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.face{position:absolute;inset:0;border-radius:var(--tr);display:flex;align-items:center;justify-content:center;
  font-weight:700;line-height:1;overflow:hidden;background-size:cover;background-position:center;background-repeat:no-repeat;
  font-size:calc(var(--tpx) * var(--fs,.5));font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.face.num{box-shadow:inset 0 0 0 1px rgba(30,40,51,.05)}
.face.glow{box-shadow:0 0 0 1px rgba(214,160,20,.35),0 0 calc(var(--tpx)*.25) rgba(255,196,60,.45)}
.badge{position:absolute;right:6%;bottom:6%;background:rgba(255,255,255,.88);color:#1e2833;border-radius:3px;
  font-size:max(9px,calc(var(--tpx) * .17));padding:.12em .32em;font-weight:700;line-height:1.1}
.board.tiny .badge{display:none}

.over{position:absolute;inset:0;background:rgba(244,246,249,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:5;text-align:center;padding:20px;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.over h2{margin:0;font-size:30px}
.over p{margin:0;color:var(--muted)}

/* Evolution */
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:14px}
.card h3{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between;align-items:baseline}
.card h3 span{font-weight:500;color:var(--muted);font-size:12px}
.evo{display:flex;flex-wrap:wrap;gap:8px 6px;--tpx:40px;--tr:4px}
.evo-item{display:flex;flex-direction:column;align-items:center;gap:3px;width:40px}
.evo-item .sq{position:relative;width:40px;height:40px}
.evo-item small{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.evo-item.locked .sq{opacity:.32}
.evo-item.cur .sq{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.hint{margin:14px 0 0;text-align:center;font-size:12px;color:var(--muted)}

/* Toast */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-20px);opacity:0;background:var(--ink);color:#fff;
  padding:10px 16px;border-radius:8px;font-weight:600;display:flex;align-items:center;gap:10px;z-index:100;pointer-events:none;transition:all .25s;box-shadow:0 8px 24px rgba(0,0,0,.18);max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .sq{width:32px;height:32px;position:relative;--tpx:32px;--tr:4px;flex:none}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(20,28,38,.38);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fadein .15s}
@media (min-width:600px){.modal{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:540px;max-height:92vh;overflow:auto;border-radius:12px 12px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
@media (min-width:600px){.sheet{border-radius:12px}}
.sheet.narrow{max-width:400px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet-head h2{margin:0;font-size:20px}
.section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
.section h4{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row+.row{margin-top:8px}
select,input[type=text],input[type=url],textarea{border:1px solid var(--line);background:#fff;border-radius:6px;padding:9px 10px;font-size:16px;width:100%}
select{flex:1;min-width:0}
textarea{min-height:90px;font-size:13px;font-family:ui-monospace,monospace}
label.check{display:flex;align-items:center;gap:8px;font-size:15px}
label.check input{width:20px;height:20px}
.muted{color:var(--muted);font-size:13px;margin:6px 0 0}
.lvl{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.lvl:first-of-type{border-top:0}
.lvl .sq{position:relative;width:48px;height:48px;flex:none;--tpx:48px;--tr:4px;cursor:pointer}
.lvl .num{width:52px;font-weight:700;font-variant-numeric:tabular-nums}
.lvl .btns{display:flex;gap:6px;flex-wrap:wrap;flex:1;justify-content:flex-end}
.stat{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);gap:12px}
.stat:first-child{border-top:0}
.stat span{color:var(--muted)}
.stat b{text-align:right;font-variant-numeric:tabular-nums}
.stat b small{display:block;font-weight:400;color:var(--muted);font-size:12px}

/* Cropper */
.crop-view{position:relative;width:min(100%,320px);aspect-ratio:1/1;margin:0 auto;border-radius:6px;overflow:hidden;background:#fff;touch-action:none;cursor:grab;box-shadow:0 0 0 1px var(--line)}
.crop-view canvas{width:100%;height:100%;display:block}
.crop-view:after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5)) 33.33% 0/1px 100% no-repeat,
             linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5)) 66.66% 0/1px 100% no-repeat,
             linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5)) 0 33.33%/100% 1px no-repeat,
             linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,.5)) 0 66.66%/100% 1px no-repeat}
input[type=range]{width:100%}
.err{color:var(--danger);font-size:13px;margin:6px 0 0}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="top">
      <h1>2048</h1>
      <div class="scorebox"><div class="lbl">Pisteet</div><div class="val" id="score">0</div></div>
      <div class="scorebox"><div class="lbl">Paras</div><div class="val" id="best">0</div></div>
    </div>
    <div class="chips">
      <div class="chip"><span class="lbl">Aika</span><b id="time">0:00</b></div>
      <div class="chip"><span class="lbl">Siirrot</span><b id="moves">0</b></div>
      <div class="chip"><span class="lbl">Peruutukset</span><b id="undos">0</b></div>
    </div>
    <div class="toolbar">
      <div class="seg" id="sizes" role="group" aria-label="Ruudukon koko"></div>
      <div class="spacer"></div>
      <button class="icon-btn" id="btnStats" aria-label="Tilastot" title="Tilastot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      </button>
      <button class="icon-btn" id="btnSettings" aria-label="Asetukset ja kuvat" title="Asetukset ja kuvat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="board-wrap">
    <div class="board" id="board">
      <div class="grid" id="grid"></div>
      <div class="tiles" id="tiles"></div>
    </div>
  </div>

  <div class="actions">
    <button class="btn" id="btnUndo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      Peruuta siirto
    </button>
    <button class="btn primary" id="btnNew">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg>
      Uusi peli
    </button>
  </div>

  <div class="card">
    <h3>Eteneminen <span id="evoName">Tavalliset numerot</span></h3>
    <div class="evo" id="evo"></div>
  </div>
  <p class="hint">Pelaa nuolinäppäimillä tai pyyhkäisemällä laudalla. Peruutus: Ctrl+Z.</p>
</div>
<div class="toast" id="toast"></div>
<input type="file" accept="image/*" class="hidden-input" id="fileOne">
<input type="file" accept="image/*" multiple class="hidden-input" id="fileMany">
<input type="file" accept=".json,application/json,text/plain" class="hidden-input" id="fileImport">

<script>
'use strict';
/* ================= Perusasetukset ================= */
const SIZES = [4, 8, 16];
const CFG = {
  4:  { start: 2,  spawn: 1, gap: .028, radius: 4 },
  8:  { start: 8,  spawn: 2, gap: .014, radius: 3 },
  16: { start: 32, spawn: 4, gap: .007, radius: 2 }
};
const LEVELS = Array.from({ length: 13 }, (_, i) => 2 ** (i + 1)); // 2 … 8192
const ANIM = 100;
const KEY = 'g2048.';
const PAL = {
  2: ['#ffffff', '#4a5868'], 4: ['#e9f1ff', '#35598c'], 8: ['#dcf4ea', '#1f6b4f'],
  16: ['#c5ecd9', '#175f47'], 32: ['#d5edfb', '#1c5d84'], 64: ['#b9def6', '#154d73'],
  128: ['#e4defb', '#4a3a8e'], 256: ['#d2c8f5', '#3d2e84'], 512: ['#fbdbe9', '#8a2f5b'],
  1024: ['#f6c4da', '#78234e'], 2048: ['#ffe6a3', '#7a5200'], 4096: ['#ffd472', '#6a4500'],
  8192: ['#ffc5a4', '#7a3311'], 16384: ['#ffaa86', '#6b280b'], 32768: ['#c9efab', '#2e5c12'],
  65536: ['#a6e2d6', '#145047'], 131072: ['#c3d3f3', '#22396b']
};
const $ = s => document.querySelector(s);
function h(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ================= Tallennus ================= */
const store = {
  get(k, d) { try { const v = localStorage.getItem(KEY + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(KEY + k); } catch (e) {} }
};
// Kuvat IndexedDB:hen (paljon enemmän tilaa kuin localStorage). Varalla muisti.
const imgDB = (() => {
  const mem = new Map(); let dbp = null; let broken = false;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      try {
        const r = indexedDB.open('g2048-kuvat', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('img');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error('blocked'));
      } catch (e) { rej(e); }
    });
    return dbp;
  }
  async function run(mode, fn) {
    if (broken) throw new Error('no idb');
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('img', mode); const req = fn(t.objectStore('img'));
      t.oncomplete = () => res(req ? req.result : undefined);
      t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  }
  async function safe(mode, fn, memFn) {
    try { return await run(mode, fn); } catch (e) { broken = true; return memFn(); }
  }
  return {
    get: k => safe('readonly', s => s.get(k), () => mem.get(k)),
    put: (k, v) => safe('readwrite', s => s.put(v, k), () => { mem.set(k, v); }),
    del: k => safe('readwrite', s => s.delete(k), () => { mem.delete(k); })
  };
})();

/* ================= Tilastot ================= */
let STATS = store.get('stats', {});
function st(n) {
  if (!STATS[n]) STATS[n] = { best: 0, bestTile: 0, games: 0, wins: 0, fast: null, fewMoves: null, fewUndos: null };
  return STATS[n];
}
function saveStats() { store.set('stats', STATS); }

/* ================= Profiilit ja kuvat ================= */
let profiles = store.get('profiles', []);
let activeId = store.get('active', null);
let showValue = store.get('showValue', true);
if (activeId && !profiles.find(p => p.id === activeId)) activeId = null;
let imgURLs = {};  // arvo -> blob-URL
function activeProfile() { return profiles.find(p => p.id === activeId) || null; }
function saveProfiles() { store.set('profiles', profiles); store.set('active', activeId); }

function dataURLtoBlob(d) {
  const [head, b64] = d.split(',');
  const mime = (head.match(/:(.*?);/) || [, 'image/jpeg'])[1];
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
async function loadActiveImages() {
  const old = imgURLs; const next = {};
  if (activeId) {
    const pid = activeId;
    const recs = await Promise.all(LEVELS.map(v => imgDB.get(pid + ':' + v).catch(() => null)));
    if (pid !== activeId) return; // vaihdettiin kesken
    recs.forEach((r, i) => { if (r && r.data) { try { next[LEVELS[i]] = URL.createObjectURL(dataURLtoBlob(r.data)); } catch (e) {} } });
  }
  imgURLs = next;
  Object.values(old).forEach(u => URL.revokeObjectURL(u));
  refreshFaces();
}

/* ================= Laatan ulkoasu ================= */
function fsFor(v) { const d = String(v).length; return [0, .52, .48, .4, .32, .26, .22, .19][Math.min(d, 7)]; }
function colors(v) { return PAL[v] || ['#1e2833', '#ffffff']; }
function paintFace(face, v, badge = true) {
  const url = imgURLs[v];
  face.textContent = '';
  if (url) {
    face.className = 'face img';
    face.style.backgroundImage = `url("${url}")`;
    face.style.backgroundColor = '#fff';
    face.style.color = '';
    if (badge && showValue) face.appendChild(h('span', 'badge', v));
  } else {
    const [bg, fg] = colors(v);
    face.className = 'face num' + (v >= 2048 ? ' glow' : '');
    face.style.backgroundImage = '';
    face.style.backgroundColor = bg;
    face.style.color = fg;
    face.style.setProperty('--fs', fsFor(v));
    face.textContent = v;
  }
}
function miniTile(v, badge = false) {
  const sq = h('div', 'sq'); const f = h('div', 'face'); sq.appendChild(f); paintFace(f, v, badge); return sq;
}

/* ================= Pelilogiikka ================= */
let G = null;
let nextId = 1;
const newTile = v => ({ id: nextId++, v });
function emptyIdx(cells) { const r = []; for (let i = 0; i < cells.length; i++) if (!cells[i]) r.push(i); return r; }
function spawn(cells, count) {
  const e = emptyIdx(cells);
  for (let k = 0; k < count && e.length; k++) {
    const i = e.splice(Math.floor(Math.random() * e.length), 1)[0];
    const t = newTile(Math.random() < .9 ? 2 : 4); t.isNew = true; cells[i] = t;
  }
}
function lines(n, dir) { // 0 ylös, 1 oikea, 2 alas, 3 vasen. Jokainen rivi alkaa siitä reunasta, jota kohti liikutaan.
  const out = [];
  for (let a = 0; a < n; a++) {
    const L = [];
    for (let b = 0; b < n; b++) {
      let r, c;
      if (dir === 0) { c = a; r = b; } else if (dir === 2) { c = a; r = n - 1 - b; }
      else if (dir === 3) { r = a; c = b; } else { r = a; c = n - 1 - b; }
      L.push(r * n + c);
    }
    out.push(L);
  }
  return out;
}
function slide(cells, n, dir) {
  const out = new Array(n * n).fill(null); let gained = 0, moved = false;
  for (const L of lines(n, dir)) {
    const res = [];
    for (const i of L) {
      const t = cells[i]; if (!t) continue;
      const last = res[res.length - 1];
      if (last && !last.m && last.v === t.v) {
        const nt = newTile(t.v * 2); nt.from = [last.id, t.id]; nt.m = true;
        res[res.length - 1] = nt; gained += nt.v;
      } else res.push({ id: t.id, v: t.v });
    }
    res.forEach((t, k) => { delete t.m; out[L[k]] = t; });

let runSince = null;

function freshGame(n) {

        started: false, over: false, milestone: 1024, reached: false, hist: [] };
  runSince = null;

}
function saveGame() {

  const keep = Math.max(50, Math.floor(400000 / per)); // tallennettava peruutushistoria (muistissa rajaton)
  store.set('game', { n: G.n, g: encode(G.cells), score: G.score, moves: G.moves, undos: G.undos,
    elapsed: Math.round(elapsed()), started: G.started, over: G.over, milestone: G.milestone, reached: G.reached,
    hist: G.hist.slice(-keep) });
}
function loadGame() {
  const s = store.get('game', null);

    if (s && SIZES.includes(s.n) && typeof s.g === 'string' && s.g.length === s.n * s.n) {
      G = { n: s.n, cells: decode(s.g), score: s.score | 0, moves: s.moves | 0, undos: s.undos | 0,
            elapsed: +s.elapsed || 0, started: !!s.started, over: !!s.over, milestone: s.milestone || 1024,
            reached: !!s.reached, hist: Array.isArray(s.hist) ? s.hist.filter(x => x && typeof x.g === 'string' && x.g.length === s.n * s.n) : [] };
      if (!G.cells.some(Boolean)) throw 0;
      setupBoard(); renderHard(); updateHUD(); renderEvo();
      if (G.over) showOver(true); else startTimer();

}

function move(dir) {
  if (!G || G.over || document.querySelector('.modal')) return;
  const before = encode(G.cells);
  const { out, gained, moved } = slide(G.cells, G.n, dir);
  if (!moved) return;
  G.hist.push({ g: before, s: G.score, m: G.moves });
  G.cells = out; G.score += gained; G.moves++;
  spawn(G.cells, CFG[G.n].spawn);
  const S = st(G.n);
  if (!G.started) { G.started = true; S.games++; startTimer(); }
  const mx = maxTile(G.cells);
  if (G.score > S.best) S.best = G.score;
  if (mx > S.bestTile) S.bestTile = mx;
  if (mx >= 2048 && !G.reached) {
    G.reached = true; S.wins++;
    const t = Math.round(elapsed());
    if (S.fast == null || t < S.fast) S.fast = t;
    if (S.fewMoves == null || G.moves < S.fewMoves) S.fewMoves = G.moves;
    if (S.fewUndos == null || G.undos < S.fewUndos.u || (G.undos === S.fewUndos.u && G.moves < S.fewUndos.m))
      S.fewUndos = { u: G.undos, m: G.moves, t, d: Date.now() };
  }
  if (mx >= 2048 && mx > G.milestone) { G.milestone = mx; toastTile(mx); }
  renderMove();
  if (!canMove(G.cells, G.n)) { G.over = true; pauseTimer(); setTimeout(() => { if (G.over) showOver(); }, ANIM + 60); }
  updateHUD(); if (mx !== evoMax) renderEvo();

}

// Pienentää alkuperäisen kuvan rajausta varten (max 1200 px) ja palauttaa dataURL:n.
function downscale(im, max = 1200) {

  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, hh); x.drawImage(im, 0, 0, w, hh);

}

}

  try { return downscale(im); } catch (e) { throw new Error('Sivusto ei salli kuvan käyttöä toisella sivulla. Tallenna kuva laitteellesi ja valitse se "Laitteelta"-napilla.'); }
}

}

      const pts = new Map(); let last = null;
      const pinch = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
      view.addEventListener('pointerdown', e => { view.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); last = pts.size === 2 ? { d: pinch(), z: cr.zoom } : null; });
      view.addEventListener('pointermove', e => {
        if (!pts.has(e.pointerId)) return;
        const p = pts.get(e.pointerId); const dx = e.clientX - p.x, dy = e.clientY - p.y;
        p.x = e.clientX; p.y = e.clientY;
        if (pts.size === 1) { cr.x += dx / V; cr.y += dy / V; }
        else if (pts.size === 2 && last) { cr.zoom = last.z * pinch() / last.d; zr.value = cr.zoom; }
        clampCrop(im, cr); draw();
      });
      const up = e => { pts.delete(e.pointerId); last = pts.size === 2 ? { d: pinch(), z: cr.zoom } : null; };
      view.addEventListener('pointerup', up); view.addEventListener('pointercancel', up);
      view.addEventListener('wheel', e => { e.preventDefault(); cr.zoom *= Math.exp(-e.deltaY * .0015); clampCrop(im, cr); zr.value = cr.zoom; draw(); }, { passive: false });
    }, true);
    m._onclose = () => res(result);
  });
}
function pickFile(input, multiple) {
  return new Promise(res => {
    input.value = '';
    input.onchange = () => res([...input.files]);
    input.click();
  });
}

/* ================= Asetukset-ikkuna ================= */
function openSettings() {
  openModal((s, close, m) => {
    const rebuild = () => { s.innerHTML = ''; build(); };
    m._rebuild = rebuild;
    const build = () => {
      head(s, 'Asetukset ja kuvat', close);
      const p = activeProfile();

      // Profiilin valinta
      const sec = h('div', 'section'); sec.appendChild(h('h4', null, 'Kuvasetti'));
      const r1 = h('div', 'row'); const sel = document.createElement('select');
      sel.innerHTML = `<option value="">Tavalliset numerot</option>` + profiles.map(x => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');
      sel.value = activeId || '';
      sel.onchange = async () => { activeId = sel.value || null; saveProfiles(); await loadActiveImages(); rebuild(); };
      r1.appendChild(sel); sec.appendChild(r1);
      const r2 = h('div', 'row');
      const bNew = h('button', 'btn small', '+ Uusi kuvasetti');
      bNew.onclick = async () => {
        const name = await promptBox('Uuden kuvasetin nimi', '', 'Luo'); if (!name) return;
        const id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        profiles.push({ id, name }); activeId = id; saveProfiles(); await loadActiveImages(); rebuild();
      };
      r2.appendChild(bNew);
      if (p) {
        const bRen = h('button', 'btn small', 'Nimeä uudelleen');
        bRen.onclick = async () => { const name = await promptBox('Uusi nimi', p.name); if (!name) return; p.name = name; saveProfiles(); refreshFaces(); rebuild(); };
        const bDel = h('button', 'btn small danger', 'Poista');
        bDel.onclick = async () => {
          if (!await confirmBox(`Poistetaanko "${p.name}"?`, 'Kuvasetti ja sen kuvat poistetaan pysyvästi.', 'Poista', true)) return;
          await Promise.all(LEVELS.flatMap(v => [imgDB.del(p.id + ':' + v), imgDB.del(p.id + ':' + v + ':o')]));
          profiles = profiles.filter(x => x.id !== p.id); activeId = null; saveProfiles(); await loadActiveImages(); rebuild();
        };
        r2.append(bRen, bDel);
      }
      sec.appendChild(r2);
      const r3 = h('div', 'row'); const lab = h('label', 'check'); const cb = h('input'); cb.type = 'checkbox'; cb.checked = showValue;
      cb.onchange = () => { showValue = cb.checked; store.set('showValue', showValue); refreshFaces(); };
      lab.append(cb, document.createTextNode('Näytä arvo kuvan kulmassa')); r3.appendChild(lab); sec.appendChild(r3);
      s.appendChild(sec);

      // Kuvat
      const im = h('div', 'section');
      if (!p) {
        im.appendChild(h('h4', null, 'Kuvat'));
        im.appendChild(h('p', 'muted', 'Nyt käytössä ovat tavalliset numerot. Luo uusi kuvasetti (esim. "Perhe" tai "Automerkit"), niin voit lisätä jokaiselle tasolle oman kuvan.')).style.margin = '0';
      } else {
        im.appendChild(h('h4', null, `Kuvat – ${p.name}`));
        const many = h('button', 'btn small', '＋ Lisää monta kuvaa kerralla');
        many.onclick = async () => {
          const files = await pickFile($('#fileMany'));
          if (!files.length) return;
          const empty = LEVELS.filter(v => !imgURLs[v]);
          let k = 0;
          for (const f of files) {
            if (k >= empty.length) break;
            try { const o = await fileToOrig(f); await saveLevelImage(p.id, empty[k], o); k++; } catch (e) {}
          }
          await loadActiveImages(); rebuild();
          toast(k ? `Lisättiin ${k} kuvaa tyhjille tasoille.` : 'Ei vapaita tasoja tai kuvia ei voitu lukea.');
        };
        const info = h('p', 'muted', 'Kuvat täyttävät tyhjät tasot pienimmästä alkaen. Napauta kuvaa rajataksesi sen. Tasoille, joilla ei ole kuvaa, näytetään numero.');
        im.append(many, info);
        const list = h('div'); list.style.marginTop = '8px';
        for (const v of LEVELS) {
          const row = h('div', 'lvl');
          const sq = miniTile(v, false); row.appendChild(sq);
          row.appendChild(h('div', 'num', v));
          const btns = h('div', 'btns');
          const bDev = h('button', 'btn small', 'Laitteelta');
          const bUrl = h('button', 'btn small', 'Linkki');
          btns.append(bDev, bUrl); row.appendChild(btns);
          const doCrop = async () => {
            const orig = await imgDB.get(p.id + ':' + v + ':o'); const rec = await imgDB.get(p.id + ':' + v);
            const src = orig || (rec && rec.data); if (!src) return;
            const cr = await openCropper(src, orig && rec ? rec.crop : null, v); if (!cr) return;
            await saveLevelImage(p.id, v, src, cr); await loadActiveImages(); rebuild();
          };
          if (imgURLs[v]) {
            const bCrop = h('button', 'btn small', 'Rajaa'); bCrop.onclick = doCrop;
            const bRm = h('button', 'btn small danger', '✕'); bRm.setAttribute('aria-label', 'Poista kuva');
            bRm.onclick = async () => { await imgDB.del(p.id + ':' + v); await imgDB.del(p.id + ':' + v + ':o'); await loadActiveImages(); rebuild(); };
            btns.append(bCrop, bRm); sq.onclick = doCrop;
          } else {
            sq.onclick = () => bDev.click();
          }
          const afterOrig = async orig => {
            const cr = await openCropper(orig, null, v); if (!cr) return;
            await saveLevelImage(p.id, v, orig, cr); await loadActiveImages(); rebuild();
          };
          bDev.onclick = async () => {
            const [f] = await pickFile($('#fileOne')); if (!f) return;
            try { await afterOrig(await fileToOrig(f)); } catch (e) { toast('Kuvaa ei voitu lukea.'); }
          };
          bUrl.onclick = () => openUrlDialog(v, afterOrig);
          list.appendChild(row);
        }
        im.appendChild(list);
      }
      s.appendChild(im);

      // Varmuuskopio
      const bk = h('div', 'section'); bk.appendChild(h('h4', null, 'Jaa ja varmuuskopioi'));
      bk.appendChild(h('p', 'muted', 'Kuvat tallentuvat vain tälle laitteelle. Vie kuvasetti tiedostoksi tai tekstiksi, niin voit siirtää sen toiselle laitteelle tai kaverille.')).style.margin = '0 0 10px';
      const br = h('div', 'row');
      if (p) { const be = h('button', 'btn small', 'Vie kuvasetti'); be.onclick = () => exportProfile(p); br.appendChild(be); }
      const bi = h('button', 'btn small', 'Tuo kuvasetti'); bi.onclick = () => openImport(rebuild); br.appendChild(bi);
      bk.appendChild(br); s.appendChild(bk);
    };
    build();
  });
}
function openUrlDialog(v, afterOrig) {
  openModal((s, close) => {
    head(s, `Kuva linkistä – taso ${v}`, close);
    const inp = h('input'); inp.type = 'url'; inp.placeholder = 'https://…/kuva.jpg'; s.appendChild(inp);
    const err = h('p', 'err'); err.hidden = true; s.appendChild(err);
    s.appendChild(h('p', 'muted', 'Liitä suora linkki kuvaan (päättyy usein .jpg tai .png). Jos linkki ei toimi, tallenna kuva laitteelle ja käytä "Laitteelta"-nappia.'));
    const row = h('div', 'row'); row.style.cssText = 'justify-content:flex-end;margin-top:12px';
    const c = h('button', 'btn', 'Peruuta'); c.onclick = close;
    const ok = h('button', 'btn primary', 'Hae kuva');
    ok.onclick = async () => {
      const u = inp.value.trim(); if (!/^https?:\/\//i.test(u)) { err.textContent = 'Linkin pitää alkaa https://'; err.hidden = false; return; }
      ok.disabled = true; ok.textContent = 'Haetaan…'; err.hidden = true;
      try { const orig = await urlToOrig(u); close(); afterOrig(orig); }
      catch (e) { err.textContent = e.message; err.hidden = false; ok.disabled = false; ok.textContent = 'Hae kuva'; }
    };
    inp.onkeydown = e => { if (e.key === 'Enter') ok.click(); };
    row.append(c, ok); s.appendChild(row); setTimeout(() => inp.focus(), 30);
  }, true);
}
async function exportProfile(p) {
  const images = {};
  for (const v of LEVELS) { const r = await imgDB.get(p.id + ':' + v); if (r && r.data) images[v] = r.data; }
  const json = JSON.stringify({ app: '2048-kuvasetti', version: 1, name: p.name, images });
  openModal((s, close) => {
    head(s, 'Vie kuvasetti', close);
    s.appendChild(h('p', 'muted', `"${p.name}" – ${Object.keys(images).length} kuvaa. Lataa tiedosto tai kopioi teksti ja lähetä se esim. viestillä.`)).style.margin = '0 0 12px';
    const row = h('div', 'row');
    const dl = h('button', 'btn primary', 'Lataa tiedosto');
    dl.onclick = async () => {
      const filename = (p.name.replace(/[^\wåäöÅÄÖ\- ]+/g, '').trim() || 'kuvasetti') + '.2048.json';
      if (window.claude && typeof window.claude.use === 'function') {
        try {
          const d = await window.claude.use('downloads');
          if (d) { await d.save({ filename, data: json }); return; }
        } catch (e) { toast('Lataus peruttiin tai ei onnistunut – voit käyttää kopiointia.'); return; }
      }
      try {
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
        a.download = filename; document.body.appendChild(a); a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      } catch (e) { toast('Lataus ei onnistunut – käytä kopiointia.'); }
    };
    const cp = h('button', 'btn', 'Kopioi tekstinä');
    cp.onclick = async () => { try { await navigator.clipboard.writeText(json); toast('Kopioitu leikepöydälle!'); } catch (e) { toast('Kopiointi ei onnistunut tässä selaimessa.'); } };
    row.append(dl, cp); s.appendChild(row);
  }, true);
}
function openImport(after) {
  openModal((s, close) => {
    head(s, 'Tuo kuvasetti', close);
    const err = h('p', 'err'); err.hidden = true;
    const bf = h('button', 'btn', 'Valitse tiedosto…');
    const ta = h('textarea'); ta.placeholder = '…tai liitä kopioitu teksti tähän';
    const ok = h('button', 'btn primary', 'Tuo teksti');
    const doImport = async txt => {
      try {
        const d = JSON.parse(txt);
        if (!d || d.app !== '2048-kuvasetti' || typeof d.images !== 'object') throw 0;
        let name = String(d.name || 'Tuotu').slice(0, 40); const base = name; let k = 2;
        while (profiles.some(x => x.name === name)) name = `${base} (${k++})`;
        const id = 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        for (const v of LEVELS) {
          const data = d.images[v];
          if (typeof data === 'string' && /^data:image\//.test(data)) await saveLevelImage(id, v, data, null);
        }
        profiles.push({ id, name }); activeId = id; saveProfiles(); await loadActiveImages();
        close(); after && after(); toast(`Kuvasetti "${name}" tuotu.`);
      } catch (e) { err.textContent = 'Tiedosto tai teksti ei ole kelvollinen kuvasetti.'; err.hidden = false; }
    };
    bf.onclick = async () => { const [f] = await pickFile($('#fileImport')); if (f) doImport(await f.text()); };
    ok.onclick = () => doImport(ta.value.trim());
    s.append(bf, h('div')); s.lastChild.style.height = '10px';
    s.append(ta, err);
    const row = h('div', 'row'); row.style.cssText = 'justify-content:flex-end;margin-top:10px'; row.appendChild(ok); s.appendChild(row);
  }, true);
}

/* ================= Asennettavuus (kotinäytölle) ================= */
(() => {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d');
    x.fillStyle = '#ffe6a3'; x.fillRect(0, 0, 512, 512);
    x.fillStyle = '#7a5200'; x.font = 'bold 170px system-ui, -apple-system, Segoe UI, Roboto, sans-serif';
    x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('2048', 256, 270);
    const icon = c.toDataURL('image/png');
    const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = icon; document.head.appendChild(l);
    const fav = document.createElement('link'); fav.rel = 'icon'; fav.href = icon; document.head.appendChild(fav);
    if (location.protocol.startsWith('http')) {
      const base = location.href.split('#')[0];
      const man = { name: '2048', short_name: '2048', start_url: base, scope: base.replace(/[^/]*$/, ''), display: 'standalone',
        background_color: '#f4f6f9', theme_color: '#f4f6f9', icons: [{ src: icon, sizes: '512x512', type: 'image/png', purpose: 'any' }] };
      const ml = document.createElement('link'); ml.rel = 'manifest';
      ml.href = URL.createObjectURL(new Blob([JSON.stringify(man)], { type: 'application/manifest+json' }));
      document.head.appendChild(ml);
    }
  } catch (e) {}
})();
